### CHARACTERS ###
 ## GRY: COUNTRY LEADERS
  GRY_hetman_calas_bulba: "Kalas Bulba"
  GRY_pavel_vereskopadsky: "Pavlo Vereskopadsky"
  GRY_yeven_krawvelets: "Yevhen Kravelets"
  GRY_borad_grifnitsky: "Borad Hryfnytsky"
  GRY_cornilo_khurshevich: "Kornylo Khrushchevych"

  GRY_BULBA_DESC: "Kalas Bulba is a wise and wisened old griffon, and has ruled the Gryphians for over forty years. He is held in high regard by almost everyone, both for his sage advice and for his surprising youthfulness and energy, considering his age. Despite his doctors telling him that he should stop leading raids in person like he did in his youth, he refuses to listen, for as he says: \"I would rather die than live the rest of my years in my bed\"."
  GRY_YEVEN_DESC: "Despite being the grandson of old Hetman Bulba's sister, Yevhen Kravelets is something of a dark mirror of the old bird. Where Bulba was straightforward and honest, Yevhen is loud-mouthed and fond of verbal abuse. Where Bulba was valiant, Yevhen is violent. One thing he has got, however, is ambition - and lots of it. He dreams of restoring the Zaphzian people to ancient greatness, and is willing to use force to achieve his dream of a \"Greater Zaphzia\".\n\n§YPortrait By§!: Motley"
  GRY_CORNBOI_DESC: "Kornylo Khrushchevych was a confidante of Redglad's, and was one of his old drinking buddies before the Revolution in Prywhen broke out. Sxortly before this, Kornylo Khrushchevych left Prywhen to lead the resistance in his own home country. Now that he is in power, he will certainly seek out his old friend and align with him. He favors a policy of solidarity with Prywhen and caring for the vulnerable farming class as the way forward for Zaphzia."
  GRY_BORAD_DESC: "Borad Hryfnytsky is an atypical cossack - though valiant in battle, he is not fond of violence and prefers to find peaceful, long-term solutions to serious problems where possible. In the warlike Cossack society this should have isolated and ostracised him, but a combination of battlefield valor, an amicable personality, and exceptional oratory has drawn a following to him nonetheless. Seeing the poor state of the Zapzhans, he desires to reform the Host into a democratic republic and diplomatically secure their people against reprisals from the Communists and the Riverponies."

